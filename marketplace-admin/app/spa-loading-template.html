<div id="__nuxt-preloader">
  <div style="display:flex;flex-direction:column;align-items:center">
    <div class="pl-ring"><div class="pl-icon"><span>SM</span></div></div>
    <div class="pl-brand">Service<span class="pl-accent">Market</span></div>
    <div class="pl-sub">Admin Dashboard</div>
    <div class="pl-bar"><div class="pl-bar-fill"></div></div>
  </div>
</div>
<style>
#__nuxt-preloader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8fafc 0%,#eef2ff 50%,#e0e7ff 100%);transition:opacity .4s ease,transform .4s ease}
#__nuxt-preloader.hide{opacity:0;transform:scale(1.05);pointer-events:none}
#__nuxt-preloader .pl-ring{position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center}
#__nuxt-preloader .pl-ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid #e2e8f0;border-top-color:#5c52e9;border-right-color:#7c74f0;animation:pl-spin 1s cubic-bezier(.4,0,.2,1) infinite}
#__nuxt-preloader .pl-icon{width:56px;height:56px;border-radius:1rem;background:linear-gradient(135deg,#4338ca,#5c52e9,#7c74f0);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(92,82,233,.35);animation:pl-pulse 1.5s ease-in-out infinite}
#__nuxt-preloader .pl-icon span{color:#fff;font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:1.375rem}
#__nuxt-preloader .pl-brand{font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:1.25rem;color:#0f172a;margin-top:1rem}
#__nuxt-preloader .pl-accent{background:linear-gradient(135deg,#4338ca,#7c74f0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#__nuxt-preloader .pl-sub{font-family:Inter,sans-serif;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.15em;color:#64748b;margin-top:.25rem}
#__nuxt-preloader .pl-bar{width:140px;height:3px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin-top:.75rem}
#__nuxt-preloader .pl-bar-fill{width:40%;height:100%;border-radius:999px;background:linear-gradient(90deg,#5c52e9,#818cf8);animation:pl-progress .8s ease-in-out infinite alternate}
@keyframes pl-spin{to{transform:rotate(360deg)}}
@keyframes pl-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes pl-progress{from{transform:translateX(-20%);width:30%}to{transform:translateX(200%);width:50%}}
</style>
